name: GlassesMic
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    PRODUCT_BUNDLE_IDENTIFIER: dev.personal.glassesmic
    TARGETED_DEVICE_FAMILY: '1'
targets:
  GlassesMic:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: 'Микрофон очков'
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        NSMicrophoneUsageDescription: 'Запись звука выбранного Bluetooth-микрофона для проверки очков.'
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    scheme: {}
